version: "3.8"

services:
  ti-server:
    container_name: ti-server
    build:
      context: ./server/
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  ti-client:
    container_name: ti-client
    build:
      context: ./client/
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - bo-server
